name: Deploy React app to GitHub Pages

on:
  push:
    branches:
      - main    # whenever you push to main, this runs

permissions:
  contents: write  # needed to push to gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'    # or whatever version you use

      - name: Install dependencies
        run: npm ci             # or `npm install` if you don't use package-lock

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages      # target branch
          folder: build         # output folder from npm run build